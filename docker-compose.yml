services:
  wxread:
    image: ghcr.io/wlunan/wxread:latest
    container_name: wxread
    restart: unless-stopped

    environment:
      TZ: "Asia/Shanghai"

      # 目标总阅读时长范围（分钟）——主开关；想固定时长就把上下限填成相同的值
      READ_TIME_MIN: 20
      READ_TIME_MAX: 20

      # 每次阅读的间隔范围（秒）；默认 20~40，均值约 30
      READ_INTERVAL_MIN: 20
      READ_INTERVAL_MAX: 40

      # 兼容旧配置：仅当未配置 READ_TIME_* 时生效（READ_NUM × 30 秒），已弃用
      # READ_NUM: 40

      # 微信读书 curl bash 命令（必需）
      # 使用 | 表示多行字符串，下一行开始粘贴完整的 curl 命令
      WXREAD_CURL_BASH: |
        curl 'https://weread.qq.com/web/book/read' \
        -H 'accept: application/json, text/plain, */*' \
        .....

      # 定时任务时间（Cron 表达式，时区为 TZ）；默认上海 07:00
      CRON_SCHEDULE: "0 7 * * *"

      # 在基准时刻上随机延迟 0~N 秒，默认 1200 秒（即 0~20 分钟）
      RUN_JITTER_SECONDS: 1200

      # 可选配置：推送方式 (pushplus/wxpusher/telegram/serverchan)
      PUSH_METHOD: ""
      # PushPlus 推送配置
      PUSHPLUS_TOKEN: ""
      # Telegram 推送配置
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      # WxPusher 推送配置
      WXPUSHER_SPT: ""
      # ServerChan 推送配置
      SERVERCHAN_SPT: ""
